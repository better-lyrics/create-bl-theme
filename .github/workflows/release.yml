name: Release

on:
  push:
    branches:
      - master
      - next
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "create-bl-theme@$version" version >/dev/null 2>&1; then
            echo "create-bl-theme@$version is already on npm"
          else
            npm publish
          fi
